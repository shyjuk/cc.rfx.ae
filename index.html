<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Screen Iframe</title>
  <style>
    /* 1. Reset parent containers to allow full-height calculations */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* Prevents accidental double scrollbars */
      background-color: #000; /* Optional: Prevents white flash while loading */
    }

    /* 2. Force the iframe to fill the entire viewport */
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;   /* Removes tiny default baseline gaps */
      
      /* Hardware acceleration to keep animations or videos smooth */
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }
  </style>
</head>
<body>
  <iframe src="https://credit-card-payment-tracker.fastapicloud.dev" title="CC Track"   allow="fullscreen" allowfullscreen></iframe>
</body>
</html>
